<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Details</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <div class="product-container">
      
      <div class="product-gallery">
        <div class="main-image">
          <span class="left-arrow">◀</span>
          <span class="right-arrow">▶</span>
        </div>

        <div class="gallery-bottom">
          <div class="thumbnails">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>

          <p>More Images........</p>
        </div>
      </div>

      
      <div class="product-info">
        
        <div class="color-section">
          <p class="heading">Select Colour :</p>

          <div class="color-options">
            <div class="color-item">
              <div class="color-box blue"></div>
              <p>Blue</p>
            </div>

            <div class="color-item">
              <div class="color-box magenta"></div>
              <p>Magenta</p>
            </div>

            <div class="color-item">
              <div class="color-box purple"></div>
              <p>Purple</p>
            </div>

            <div class="color-item">
              <div class="color-box royal-pink"></div>
              <p>Royal Pink</p>
            </div>

            <div class="color-item">
              <div class="color-box wine"></div>
              <p>Wine</p>
            </div>

            <div class="color-item">
              <div class="color-box red"></div>
              <p>Red</p>
            </div>

            <div class="color-item">
              <div class="color-box green"></div>
              <p>Green</p>
            </div>
          </div>
        </div>

        <h2>EMBROIDERED SAREE (BRIGHT YELLOW)</h2>

        
        <p class="price">850/-</p>

        <p class="discount">HUGE PRICE DROP (30% OFF)</p>

        
        <div class="rating">
          <span>RATING</span>

          <span>4.0/5</span>

          <span class="stars">★★★★<span>★</span></span>
        </div>

       
        <div class="location">
          <label for="location">SELECT LOCATION</label>

          <select id="location">
            <option>KOLKATA</option>
            <option>DELHI</option>
            <option>MUMBAI</option>
            <option>BANGALORE</option>
          </select>
        </div>

        
        <div class="buttons">
          <button class="cart-btn">ADD TO CART</button>

          <button class="buy-btn">BUY NOW!!</button>
        </div>
      </div>
    </div>
  </body>
</html>
